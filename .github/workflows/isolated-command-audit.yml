name: Frieren isolated command audit
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - "*.js"
      - "commands/**"
      - "database/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/isolated-command-audit.yml"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: frieren-isolated-audit-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frieren_audit
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d frieren_audit" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/frieren_audit
      PGSSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Rehearse versioned migrations on disposable PostgreSQL schema
        run: node --test scripts/test-database-migrations.integration.js
      - run: node scripts/run-isolated-command-audit.js
      - name: Run real PostgreSQL market concurrency and rollback tests
        run: node --test scripts/test-market-concurrency.integration.js
      - name: Run real PostgreSQL arena matchmaking concurrency and rollback tests
        run: node --test scripts/test-arena-queue.integration.js
      - name: Run real PostgreSQL seasons, events and adventurer linking tests
        run: node --test scripts/test-adventurer-platform.integration.js
      - name: Run real PostgreSQL home, cosmetics and event progression tests
        run: node --test scripts/test-player-experience.integration.js
      - name: Run real PostgreSQL integration tests for quiz, companions, fishing, farming, creatures, wishlist and player market
        run: node --test --test-concurrency=1 scripts/test-animequiz.integration.js scripts/test-companions.integration.js scripts/test-fishing.integration.js scripts/test-farming.integration.js scripts/test-creatures.integration.js scripts/test-character-wishlist.integration.js scripts/test-player-market.integration.js
      - name: Run real PostgreSQL account export, support history and deletion-scope tests
        run: node --test --test-concurrency=1 scripts/test-account-center.integration.js
      - name: Run real PostgreSQL social relationships, gifts and reputation tests
        run: node --test scripts/test-social-platform.integration.js
      - name: Run real PostgreSQL guild mini-game concurrency and guild isolation tests
        run: node --test scripts/test-guild-games.integration.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frieren-isolated-command-audit
          path: command-audit-report.json
