name: Register Poğaça Frieren in test guild only

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/register-test-guild-only.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: discord-command-registration
  cancel-in-progress: true

jobs:
  register-test-guild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Register commands in the test guild only
        run: npm run deploy-commands
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_IDS: "1564945192803639356"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
