name: Frieren AI CI

on:
  push:
    branches: [main]
    paths:
      - 'ai-agent/**'
      - '.github/workflows/frieren-ai-ci.yml'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'ai-agent/**'
      - '.github/workflows/frieren-ai-ci.yml'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frieren-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install RPG bot dependencies
        run: npm install
      - name: Install Frieren AI dependencies
        run: npm install --prefix ai-agent
      - name: Run focused Frieren AI syntax and regression tests
        run: |
          node --check ai-agent/index.js
          node --check ai-agent/register-commands.js
          node --test --test-concurrency=1 ai-agent/*.test.js
