name: Frieren Neural Turkish Chat Max Candidate Training

on:
  workflow_dispatch:
  push:
    branches:
      - test/frieren-neural-render-free
      - feat/neural-single-core-integration-20261107
    paths:
      - frieren-neural/.training-request

permissions:
  contents: read

concurrency:
  group: frieren-neural-chat-max-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frieren-neural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frieren-neural/pyproject.toml
      - name: Install CPU-only PyTorch and training/test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e ".[dev,discord,data]" "fastapi>=0.110" "uvicorn[standard]>=0.27" "psycopg[binary]>=3.2"
      - name: Run complete test suite before training
        run: pytest
      - name: Import pinned Apache-2.0 Turkish SFT corpus
        run: frieren-neural-import-chat-max --output ./corpus/turkish-chat-max-25k
      - name: Validate exact assistant-only train and validation encoding
        run: |
          python - <<'PY'
          from frieren_neural.tokenizer import BPETokenizer
          from frieren_neural.training import encode_dialogue_stream_with_loss_mask, load_licensed_corpus, split_corpus_text

          documents = load_licensed_corpus("./corpus/turkish-chat-max-25k/train")
          train_text, validation_text = split_corpus_text(documents)
          tokenizer = BPETokenizer.train([train_text], vocab_size=1024, min_frequency=2)
          for split, text in (("train", train_text), ("validation", validation_text)):
              try:
                  token_ids, loss_mask = encode_dialogue_stream_with_loss_mask(text, tokenizer)
                  if not token_ids or len(token_ids) != len(loss_mask) or not any(loss_mask):
                      raise ValueError("empty token stream or assistant loss mask")
              except Exception as error:
                  separator = "\n\n---\n\n"
                  for index, dialogue in enumerate(text.split(separator)):
                      try:
                          encode_dialogue_stream_with_loss_mask(dialogue, tokenizer)
                      except Exception as dialogue_error:
                          print(f"First invalid {split} dialogue index={index}: {dialogue[:1200]!r}")
                          raise SystemExit(f"{split} dialogue {index} is invalid: {dialogue_error}") from error
                  raise SystemExit(f"{split} combined stream is invalid: {error}") from error
              print(f"{split}: parsed {len(text.split(chr(10) + chr(10) + '---' + chr(10) + chr(10)))} dialogues")
          PY
      - name: Preserve immutable corpus inputs for all training stages
        uses: actions/upload-artifact@v4
        with:
          name: frieren-neural-training-inputs-${{ github.sha }}
          path: frieren-neural/corpus/turkish-chat-max-25k/
          if-no-files-found: error
          retention-days: 30

  train-8000:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: frieren-neural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frieren-neural/pyproject.toml
      - name: Install CPU-only PyTorch and Frieren Neural
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install "numpy>=1.24"
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v4
        with:
          name: frieren-neural-training-inputs-${{ github.sha }}
          path: frieren-neural/corpus/turkish-chat-max-25k/
      - name: Train the existing Frieren Neural model to step 8,000
        run: |
          set -o pipefail
          frieren-neural-train-small --data ./corpus/turkish-chat-max-25k/train \
            --checkpoint ./checkpoints/frieren-neural-chat-max-25k.pt \
            --steps 8000 --batch-size 4 --block-size 128 --eval-interval 500 --eval-batches 10 \
            --d-model 128 --n-heads 4 --n-layers 4 --tokenizer-vocab-size 1024 --seed 1337 \
            | tee ./training-metrics-step-8000.json
      - name: Archive resumable 8,000-step checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frieren-neural-training-step-8000-${{ github.sha }}
          path: |
            frieren-neural/corpus/turkish-chat-max-25k/
            frieren-neural/checkpoints/frieren-neural-chat-max-25k.pt
            frieren-neural/training-metrics-step-8000.json
          if-no-files-found: warn
          retention-days: 30

  train-16000:
    needs: train-8000
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: frieren-neural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frieren-neural/pyproject.toml
      - name: Install CPU-only PyTorch and Frieren Neural
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install "numpy>=1.24"
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v4
        with:
          name: frieren-neural-training-step-8000-${{ github.sha }}
          path: frieren-neural/
      - name: Continue the same checkpoint to step 16,000
        run: |
          set -o pipefail
          frieren-neural-train-small --data ./corpus/turkish-chat-max-25k/train \
            --checkpoint ./checkpoints/frieren-neural-chat-max-25k.pt --resume \
            --steps 16000 --batch-size 4 --block-size 128 --eval-interval 500 --eval-batches 10 \
            --d-model 128 --n-heads 4 --n-layers 4 --tokenizer-vocab-size 1024 --seed 1337 \
            | tee ./training-metrics-step-16000.json
      - name: Archive resumable 16,000-step checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frieren-neural-training-step-16000-${{ github.sha }}
          path: |
            frieren-neural/corpus/turkish-chat-max-25k/
            frieren-neural/checkpoints/frieren-neural-chat-max-25k.pt
            frieren-neural/training-metrics-step-16000.json
          if-no-files-found: warn
          retention-days: 30

  train-24000:
    needs: train-16000
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: frieren-neural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frieren-neural/pyproject.toml
      - name: Install CPU-only PyTorch and Frieren Neural
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install "numpy>=1.24"
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v4
        with:
          name: frieren-neural-training-step-16000-${{ github.sha }}
          path: frieren-neural/
      - name: Continue the same checkpoint to step 24,000
        run: |
          set -o pipefail
          frieren-neural-train-small --data ./corpus/turkish-chat-max-25k/train \
            --checkpoint ./checkpoints/frieren-neural-chat-max-25k.pt --resume \
            --steps 24000 --batch-size 4 --block-size 128 --eval-interval 500 --eval-batches 10 \
            --d-model 128 --n-heads 4 --n-layers 4 --tokenizer-vocab-size 1024 --seed 1337 \
            | tee ./training-metrics-step-24000.json
      - name: Verify final checkpoint and generate a Turkish smoke sample
        run: |
          python - <<'PY'
          import json, math
          from frieren_neural.training import generate_text, load_checkpoint
          model, tokenizer, metadata = load_checkpoint("./checkpoints/frieren-neural-chat-max-25k.pt", device="cpu")
          assert metadata["step"] == 24000, metadata
          assert metadata["loss_objective_version"] == 2, metadata
          assert math.isfinite(metadata["train_loss"]) and math.isfinite(metadata["validation_loss"])
          sample = generate_text(model, tokenizer, "Kullanıcı: Merhaba.\nAsistan:", max_new_tokens=64, top_k=20)
          print(json.dumps({"checkpoint": "loadable", "metadata": metadata, "sample": sample}, ensure_ascii=False, indent=2))
          PY
      - name: Evaluate on the separate deterministic held-out split
        run: |
          set -o pipefail
          frieren-neural-evaluate --data ./corpus/turkish-chat-max-25k/heldout \
            --checkpoint ./checkpoints/frieren-neural-chat-max-25k.pt \
            --batch-size 4 --batches 25 --device cpu | tee ./heldout-metrics.json
      - name: Generate the fixed 24-prompt Turkish quality report
        run: |
          frieren-neural-evaluate-quality \
            --checkpoint ./checkpoints/frieren-neural-chat-max-25k.pt \
            --output-dir ./quality-reports/turkish-chat-max-25k \
            --training-manifest ./corpus/turkish-chat-max-25k/train/corpus_manifest.json \
            --heldout-report ./heldout-metrics.json
      - name: Archive final checkpoint and complete evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frieren-neural-chat-max-24k-candidate-${{ github.sha }}
          path: |
            frieren-neural/corpus/turkish-chat-max-25k/
            frieren-neural/checkpoints/frieren-neural-chat-max-25k.pt
            frieren-neural/training-metrics-step-24000.json
            frieren-neural/heldout-metrics.json
            frieren-neural/quality-reports/turkish-chat-max-25k/
          if-no-files-found: warn
          retention-days: 30
