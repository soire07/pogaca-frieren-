name: Frieren AI Safe Self-Repair

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Describe the specific bug or missing behavior to repair"
        required: true
        type: string
      base_branch:
        description: "Branch to test against"
        required: true
        default: "frieren-ai-agent"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: frieren-ai-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout requested base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate a constrained repair proposal
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FRIEREN_AI_MODEL: gpt-4.1-mini
          FRIEREN_REPAIR_TASK: ${{ inputs.task }}
        run: node scripts/ai-self-repair.js

      - name: Verify syntax, command contracts and regression tests
        run: npm run check

      - name: Open a repair pull request (never deploy directly)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ inputs.base_branch }}
          branch: ai-repair/frieren-${{ github.run_id }}
          delete-branch: true
          title: "AI repair: ${{ inputs.task }}"
          body: |
            Automated Frieren AI repair proposal.

            **Requested task:** ${{ inputs.task }}

            The workflow generated a constrained patch and ran `npm run check` before opening this pull request. This PR is not automatically merged or deployed.
          commit-message: "fix: AI-assisted Frieren repair proposal"
          add-paths: |
            *.js
            ai-agent/*.js
            scripts/*.js
            database/*.js
