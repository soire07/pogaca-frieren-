name: Frieren Neural staged quality evaluation

on:
  pull_request:
    paths:
      - "frieren-neural/frieren_neural/**"
      - "frieren-neural/pyproject.toml"
      - ".github/workflows/frieren-neural-staged-quality-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frieren-neural-staged-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staged-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frieren-neural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frieren-neural/pyproject.toml
      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
      - name: Install Neural GGUF evaluation dependencies
        run: python -m pip install --only-binary=llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu -e ".[dev,serve]"
      - name: Evaluate the pinned real GGUF model on all 24 Turkish prompts
        env:
          FRIEREN_MODEL_BACKEND: ufakzeka
          FRIEREN_MODEL_THREADS: "2"
          FRIEREN_CONTEXT_SIZE: "2048"
        run: |
          python -m frieren_neural.quality_evaluation \
            --backend ufakzeka \
            --source-commit "$GITHUB_SHA" \
            --output-dir quality-reports/staged-gguf
      - name: Verify artifact provenance and keep release gate closed
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from frieren_neural.gguf_runtime import MODEL_SHA256

          report = json.loads(Path("quality-reports/staged-gguf/quality-report.json").read_text(encoding="utf-8"))
          expected_ids = [f"TR-{index:03d}" for index in range(1, 25)]
          assert report["model_backend"] == "ufakzeka"
          assert report["artifact_sha256"] == MODEL_SHA256
          assert report["checkpoint_sha256"] == MODEL_SHA256
          assert report["source_commit_sha"] == os.environ["GITHUB_SHA"]
          assert [item["id"] for item in report["outputs"]] == expected_ids
          assert all(isinstance(item.get("output"), str) and item["output"].strip() for item in report["outputs"])
          assert report["decision"] == "NOT READY"
          assert "human_review_missing" in report["blocking_reasons"]
          assert "training_provenance_missing" in report["blocking_reasons"]
          assert "held_out_metrics_missing_or_invalid" in report["blocking_reasons"]
          print("REAL_GGUF_24_PROMPTS=PASS")
          print("PINNED_ARTIFACT_SHA256=" + MODEL_SHA256)
          print("QUALITY_DECISION=" + report["decision"])
          print("BLOCKING_REASONS=" + ",".join(report["blocking_reasons"]))
          PY
      - name: Upload human-review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frieren-neural-staged-quality-review
          path: frieren-neural/quality-reports/staged-gguf/
          if-no-files-found: warn
          retention-days: 14
