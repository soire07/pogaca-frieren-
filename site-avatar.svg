 <radialGradient id="aura"><stop stop-color="#d7b9ff" stop-opacity=".5"/><stop offset="1" stop-color="#bca0ff" stop-opacity="0"/></radialGradient>
 <clipPath id="clip"><circle cx="256" cy="256" r="246"/></clipPath>
 <filter id="soft"><feGaussianBlur stdDeviation="15"/></filter>
