name: Retry Poğaça production command sync

# Discord temporarily rejected command creation with code 30034. Retry once daily;
# deploy-commands.js reads live state first and skips writes when all commands already match.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: discord-command-registration
  cancel-in-progress: true

jobs:
  sync-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frieren_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d frieren_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run project checks before touching Discord
        run: npm run check
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/frieren_test
      - name: Verify production-only target
        run: |
          test "$GUILD_IDS" = "1539562273197260860"
          test -z "${TEST_GUILD_ID:-}"
          echo "Production-only target verified."
        env:
          GUILD_IDS: "1539562273197260860"
      - name: Register only if production command definitions differ
        run: npm run deploy-commands
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_IDS: "1539562273197260860"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/frieren_test
