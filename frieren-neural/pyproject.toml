[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frieren-neural"
version = "0.1.0"
description = "From-scratch experimental decoder-only language model for Frieren AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["frieren_neural*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
