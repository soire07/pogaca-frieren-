name: Frieren AI Health Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frieren-ai-health.yml'
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frieren-ai-health-check
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Frieren AI liveness and readiness
        shell: bash
        env:
          HEALTH_URL: ${{ vars.FRIEREN_AI_HEALTH_URL || 'https://pogaca-frieren-kltd.onrender.com/health' }}
        run: |
          if [[ -z "$HEALTH_URL" ]]; then
            echo "::error::FRIEREN_AI_HEALTH_URL is required; refusing to report a skipped production health check as success."
            exit 1
          fi
          if [[ "$HEALTH_URL" != https://* ]]; then
            echo "::error::FRIEREN_AI_HEALTH_URL must use HTTPS."
            exit 1
          fi
          response_file="$RUNNER_TEMP/frieren-health.json"
          for attempt in {1..3}; do
            http_code="$(curl --silent --show-error --connect-timeout 5 --max-time 10 -o "$response_file" -w '%{http_code}' "$HEALTH_URL" 2>&1)" || true
            if [[ "$http_code" == "200" ]] && node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{try{const j=JSON.parse(s);const r=j.readiness||{};process.exit(j.status==='alive' && j.ready===true && r.status==='ok' && r.discordReady===true && r.memoryDatabaseReady===true && r.modelConfigured===true && r.bridgeConfigured===true ? 0 : 1)}catch{process.exit(1)}})" < "$response_file"; then
              echo "Frieren AI liveness and readiness passed (Discord, memory DB, model, and test bridge ready)."
              exit 0
            fi
            echo "::warning::Health attempt $attempt/3 failed; HTTP $http_code."
            if [[ "$attempt" -lt 3 ]]; then sleep 5; fi
          done
          echo "::error::Frieren AI is not fully ready after 3 attempts."
          exit 1
      - name: Verify Poğaça-to-AI authenticated bridge
        shell: bash
        env:
          BRIDGE_URL: https://pogaca-frieren.onrender.com/ai-bridge-health
        run: |
          response_file="$RUNNER_TEMP/frieren-bridge-health.json"
          for attempt in {1..3}; do
            http_code="$(curl --silent --show-error --connect-timeout 5 --max-time 15 -o "$response_file" -w '%{http_code}' "$BRIDGE_URL" 2>&1)" || true
            if [[ "$http_code" == "200" ]] && node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{try{const j=JSON.parse(s);process.exit(j.status==='ok' && j.reachable===true ? 0 : 1)}catch{process.exit(1)}})" < "$response_file"; then
              echo "Poğaça-to-Frieren AI authenticated bridge passed."
              exit 0
            fi
            echo "::warning::Bridge attempt $attempt/3 failed; HTTP $http_code."
            if [[ "$attempt" -lt 3 ]]; then sleep 5; fi
          done
          echo "::error::Poğaça-to-Frieren AI authenticated bridge is not ready."
          exit 1
