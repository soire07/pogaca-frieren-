<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">Frieren dünyası — detaylı fantastik dünya atlası</title>
<desc id="map-desc">Frieren animesinin Kuzey ve Merkez Topraklarından esinlenen, fan yapımı; yükselti gölgelendirmesi, topoğrafik eş yükselti çizgileri, dağ kuşakları, ormanlar, nehirler ve geçitler içeren interaktif RPG harita zemini.</desc>
