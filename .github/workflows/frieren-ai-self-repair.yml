name: Frieren AI Safe Self-Repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate Groq without changing code, or generate a repair proposal"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - repair
      task:
        description: "Repair task (required only when mode is repair)"
        required: false
        type: string
      incident_id:
        description: "Guardian incident ID; leave empty for manual runs"
        required: false
        type: string
      base_branch:
        description: "Isolated branch to test against"
        required: true
        default: "guardian-isolated-repair-test"
        type: choice
        options:
          - guardian-isolated-repair-test

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: frieren-ai-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate repair target branch
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          case "$BASE_BRANCH" in
            guardian-isolated-repair-test) ;;
            *) echo "Unsupported repair target branch"; exit 1 ;;
          esac
          if [ "$GITHUB_REF_NAME" != "$BASE_BRANCH" ]; then
            echo "Workflow ref must match the requested repair target branch"
            exit 1
          fi

      - name: Require a repair task when repair mode is selected
        if: inputs.mode == 'repair'
        env:
          REPAIR_TASK: ${{ inputs.task }}
        run: |
          if [ -z "$(printf '%s' "$REPAIR_TASK" | tr -d '[:space:]')" ]; then
            echo "::error title=Repair task is required::Enter a specific bug or behavior to repair when mode=repair."
            exit 1
          fi

      - name: Checkout requested base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Generate a constrained repair proposal with free Groq API
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FRIEREN_MODEL: openai/gpt-oss-20b
          FRIEREN_REPAIR_TASK: ${{ inputs.task }}
          FRIEREN_REPAIR_INCIDENT_ID: ${{ inputs.incident_id }}
          FRIEREN_REPAIR_MODE: ${{ inputs.mode }}
        id: repair
        run: node scripts/ai-self-repair.js

      - name: Verify syntax, command contracts and regression tests
        run: npm run check

      - name: Open a repair pull request (never deploy directly)
        if: inputs.mode == 'repair'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ inputs.base_branch }}
          branch: ai-repair/guardian-${{ inputs.incident_id || github.run_id }}
          delete-branch: true
          title: "AI repair: Guardian incident #${{ inputs.incident_id || github.run_id }}"
          body: |
            Automated Frieren AI repair proposal.

            **Guardian incident:** #${{ inputs.incident_id || 'manual' }}

            The private task description is intentionally not copied into this public pull request body.

            The workflow generated a constrained patch and ran `npm run check` before opening this pull request. This PR is not automatically merged or deployed.
          commit-message: "fix: AI-assisted Frieren repair proposal"
          add-paths: ${{ steps.repair.outputs.repair_files }}
