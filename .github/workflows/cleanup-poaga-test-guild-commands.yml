name: Remove Poğaça commands from Frieren AI test guild

# The test guild belongs to the separate Frieren AI app. Clear only the Poğaça app's
# stale command list there; the separate Frieren AI application's commands are untouched.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-poaga-test-guild-commands.yml"

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Remove only this application's commands from the test guild
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          TEST_GUILD_ID: "1564945192803639356"
        run: |
          node --input-type=module <<'NODE'
          const { DISCORD_TOKEN: token, CLIENT_ID: clientId, TEST_GUILD_ID: guildId } = process.env;
          if (!token || !clientId || guildId !== '1564945192803639356') {
            throw new Error('Required credentials or the fixed test-guild target are missing.');
          }
          async function request(route, method = 'GET', body) {
            const response = await fetch('https://discord.com/api/v10' + route, {
              method,
              headers: {
                authorization: 'Bot ' + token,
                'content-type': 'application/json',
                'user-agent': 'DiscordBot (https://github.com/soire07/pogaca-frieren-, 1.0.0)'
              },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
              signal: AbortSignal.timeout(15000)
            });
            const raw = await response.text();
            let data = null;
            try { data = raw ? JSON.parse(raw) : null; } catch {}
            if (!response.ok) {
              throw new Error('Discord API request failed: HTTP ' + response.status + ', code ' + (data?.code ?? 'unknown') + ', ' + (data?.message ?? 'no message'));
            }
            return data;
          }
          const app = await request('/oauth2/applications/@me');
          if (String(app.id) !== String(clientId)) {
            throw new Error('DISCORD_TOKEN does not match CLIENT_ID; refusing to modify any commands.');
          }
          const route = '/applications/' + clientId + '/guilds/' + guildId + '/commands';
          const current = await request(route);
          console.log(JSON.stringify({ check: 'before', commandCount: Array.isArray(current) ? current.length : null }));
          if (!Array.isArray(current)) throw new Error('Discord returned an unexpected command list.');
          if (current.length > 0) {
            await request(route, 'PUT', []);
          }
          const after = await request(route);
          console.log(JSON.stringify({ check: 'after', commandCount: Array.isArray(after) ? after.length : null }));
          if (!Array.isArray(after) || after.length !== 0) {
            throw new Error('Poğaça commands remain in the Frieren AI test guild.');
          }
          console.log('Poğaça command list cleared from the test guild; the separate Frieren AI application was not modified.');
          NODE
