name: Frieren Neural Test API Smoke

on:
  push:
    branches:
      - test/frieren-neural-render-free
    paths:
      - ".github/workflows/frieren-neural-test-api-smoke.yml"
      - "frieren-neural/frieren_neural/api.py"
      - "frieren-neural/frieren_neural/knowledge.py"
      - "frieren-neural/migrations/003_verified_knowledge.sql"
      - "frieren-neural/Dockerfile"
      - "frieren-neural/tests/test_serving_container_dependencies.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frieren-neural-test-api-smoke
  cancel-in-progress: true

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check liveness endpoint
        env:
          NEURAL_TEST_URL: https://frieren-neural-test-1unz.onrender.com
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail --connect-timeout 10 --max-time 20 "$NEURAL_TEST_URL/live")"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d == {"status":"alive","service":"frieren-neural"}' "$response"
          echo "NEURAL_LIVENESS=PASS"

      - name: Verify Gemini health and real generation
        env:
          NEURAL_TEST_URL: https://frieren-neural-test-1unz.onrender.com
        run: |
          set -euo pipefail
          health_status="$(curl --silent --show-error --output /tmp/neural-health.json --write-out '%{http_code}' --connect-timeout 15 --max-time 45 "$NEURAL_TEST_URL/health")"
          python -c 'import json,sys; d=json.load(open("/tmp/neural-health.json", encoding="utf-8")); assert sys.argv[1] == "200", d; assert d.get("status") == "ready"; assert d.get("model") == "gemini-3.8-flash"; assert d.get("generation_smoke") == "pass"' "$health_status"
          echo "GEMINI_HEALTH_AND_GENERATION=PASS"

      - name: Check learning endpoints are present and protected
        env:
          NEURAL_TEST_URL: https://frieren-neural-test-1unz.onrender.com
        run: |
          set -euo pipefail
          payload='{"guild_id":"12345678901234567","user_id":"22345678901234567","signals":[{"signal_type":"correction","dimension":"correctness"}]}'
          signal_status="$(curl --silent --output /tmp/signal-response --write-out '%{http_code}' --connect-timeout 10 --max-time 20 -X POST "$NEURAL_TEST_URL/learning/signals" -H 'Content-Type: application/json' --data "$payload")"
          insights_status="$(curl --silent --output /tmp/insights-response --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "$NEURAL_TEST_URL/learning/insights")"
          test "$signal_status" = "401"
          test "$insights_status" = "401"
          echo "LEARNING_SIGNAL_ROUTE_AUTH=PASS"
          echo "LEARNING_INSIGHTS_ROUTE_AUTH=PASS"


      - name: Check curated knowledge endpoints are protected
        env:
          NEURAL_TEST_URL: https://frieren-neural-test-1unz.onrender.com
        run: |
          set -euo pipefail
          candidate='{"title":"Python tuple semantics","content":"A tuple is an immutable sequence in Python and preserves insertion order.","source_title":"Python language reference","source_excerpt":"The tuple type is an immutable sequence type that stores an ordered collection of objects.","source_url":"https://docs.python.org/3/library/stdtypes.html#tuples","source_revision":"v3.14","license":"CC BY 4.0"}'
          review='{"decision":"approve","reviewer_token":"smoke-test-reviewer-token-with-more-than-32-characters"}'
          create_status="$(curl --silent --output /tmp/knowledge-create-response --write-out '%{http_code}' --connect-timeout 10 --max-time 20 -X POST "$NEURAL_TEST_URL/learning/knowledge/candidates" -H 'Content-Type: application/json' --data "$candidate")"
          list_status="$(curl --silent --output /tmp/knowledge-list-response --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "$NEURAL_TEST_URL/learning/knowledge/candidates")"
          search_status="$(curl --silent --output /tmp/knowledge-search-response --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "$NEURAL_TEST_URL/learning/knowledge/search?q=tuple")"
          review_status="$(curl --silent --output /tmp/knowledge-review-response --write-out '%{http_code}' --connect-timeout 10 --max-time 20 -X POST "$NEURAL_TEST_URL/learning/knowledge/candidates/123e4567-e89b-12d3-a456-426614174000/reviews" -H 'Content-Type: application/json' --data "$review")"
          test "$create_status" = "401"
          test "$list_status" = "401"
          test "$search_status" = "401"
          test "$review_status" = "401"
          echo "KNOWLEDGE_CANDIDATE_AUTH=PASS"
          echo "KNOWLEDGE_REVIEW_AUTH=PASS"
          echo "KNOWLEDGE_SEARCH_AUTH=PASS"
