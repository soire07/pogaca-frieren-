name: Frieren Local AI Core Checks

on:
  pull_request:
    branches:
      - frieren-ai-agent
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install root dependencies
        run: npm install
      - name: Run syntax and regression checks
        run: npm run check
      - name: Run local AI agent's isolated tests
        working-directory: ai-agent
        run: |
          npm install
          npm test
