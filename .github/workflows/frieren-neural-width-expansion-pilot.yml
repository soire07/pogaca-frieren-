name: Frieren Neural Width Expansion Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - feat/neural-single-core-integration-20261107
    paths:
      - frieren-neural/.width-expansion-pilot-request

permissions:
  actions: read
  contents: read

concurrency:
  group: frieren-neural-width-expansion-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: frieren-neural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frieren-neural/pyproject.toml
      - name: Download immutable 48K baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: frieren-neural-chat-max-48k-candidate-d6157a0033a82529e28355f11b0f54a4a8802506
          repository: soire07/pogaca-frieren-
          run-id: 42453599366
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./parent-evidence
      - name: Install CPU-only training dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e ".[dev,data]" "psycopg[binary]>=3.2"
      - name: Verify parent checkpoint identity and immutable corpus
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from frieren_neural.training import load_corpus_manifest_metadata, load_licensed_corpus

          root = Path("./parent-evidence")
          checkpoint = root / "checkpoints/frieren-neural-chat-max-25k.pt"
          expected = "cc4a6e63a1fcf9aeed5abe9ebdbef6353391917c686624e96155412e1917041e"
          actual = hashlib.sha256(checkpoint.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"Parent checkpoint SHA mismatch: {actual}")
          train = root / "corpus/turkish-chat-max-25k/train"
          heldout = root / "corpus/turkish-chat-max-25k/heldout"
          documents = load_licensed_corpus(train)
          train_meta = load_corpus_manifest_metadata(train, required_split="train")
          heldout_meta = load_corpus_manifest_metadata(heldout)
          if train_meta["source_fingerprint_sha256"] != heldout_meta["source_fingerprint_sha256"]:
              raise SystemExit("Train and held-out data do not share the same pinned source fingerprint.")
          if train_meta["processed_sha256"] == heldout_meta["processed_sha256"]:
              raise SystemExit("Train and held-out processed corpora unexpectedly match.")
          print({
              "parent_checkpoint_sha256": actual,
              "train_dialogues": len(documents),
              "train_manifest_sha256": train_meta["dataset_sha256"],
              "heldout_manifest_sha256": heldout_meta["dataset_sha256"],
          })
          PY
      - name: Evaluate preserved 48K baseline on the unchanged held-out split
        run: |
          set -o pipefail
          frieren-neural-evaluate \
            --data ./parent-evidence/corpus/turkish-chat-max-25k/heldout \
            --checkpoint ./parent-evidence/checkpoints/frieren-neural-chat-max-25k.pt \
            --batch-size 1 --batches 25 --device cpu | tee ./baseline-heldout-metrics.json
      - name: Generate baseline 24-prompt outputs with the fixed benchmark
        run: |
          frieren-neural-evaluate-quality \
            --checkpoint ./parent-evidence/checkpoints/frieren-neural-chat-max-25k.pt \
            --output-dir ./quality-reports/baseline-48k \
            --training-manifest ./parent-evidence/corpus/turkish-chat-max-25k/train/corpus_manifest.json \
            --heldout-report ./baseline-heldout-metrics.json
      - name: Train isolated 2x-width candidate from the preserved 48K checkpoint
        run: |
          set -o pipefail
          frieren-neural-train-small \
            --data ./parent-evidence/corpus/turkish-chat-max-25k/train \
            --checkpoint ./checkpoints/frieren-neural-width-256-pilot.pt \
            --initialize-from ./parent-evidence/checkpoints/frieren-neural-chat-max-25k.pt \
            --steps 1000 --batch-size 1 --block-size 512 --eval-interval 500 --eval-batches 10 \
            --d-model 256 --n-heads 8 --n-layers 4 --tokenizer-vocab-size 1024 --seed 1337 \
            | tee ./width-expansion-training-metrics.json
      - name: Evaluate candidate on the unchanged held-out split
        run: |
          set -o pipefail
          frieren-neural-evaluate \
            --data ./parent-evidence/corpus/turkish-chat-max-25k/heldout \
            --checkpoint ./checkpoints/frieren-neural-width-256-pilot.pt \
            --batch-size 1 --batches 25 --device cpu | tee ./width-expansion-heldout-metrics.json
      - name: Generate the unchanged 24-prompt quality benchmark
        run: |
          frieren-neural-evaluate-quality \
            --checkpoint ./checkpoints/frieren-neural-width-256-pilot.pt \
            --output-dir ./quality-reports/width-256-pilot \
            --training-manifest ./parent-evidence/corpus/turkish-chat-max-25k/train/corpus_manifest.json \
            --heldout-report ./width-expansion-heldout-metrics.json
      - name: Archive candidate and comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frieren-neural-width-256-pilot-${{ github.sha }}
          path: |
            frieren-neural/checkpoints/frieren-neural-width-256-pilot.pt
            frieren-neural/width-expansion-training-metrics.json
            frieren-neural/width-expansion-heldout-metrics.json
            frieren-neural/quality-reports/width-256-pilot/
          if-no-files-found: warn
          retention-days: 30
