name: Mobile browser smoke
on:
  push:
    branches: [fix/solo-boss-reward-idempotency-mainline]
    paths:
      - 'public-site.js'
      - 'site-auth.js'
      - 'owner-dashboard.js'
      - 'account-center.js'
      - 'news-birds.js'
      - 'card-variants.js'
      - 'scripts/mobile-browser-smoke.mjs'
  pull_request:
    types: [opened, reopened]
    paths:
      - 'public-site.js'
      - 'site-auth.js'
      - 'owner-dashboard.js'
      - 'account-center.js'
      - 'news-birds.js'
      - 'card-variants.js'
      - 'scripts/mobile-browser-smoke.mjs'
      - '.github/workflows/mobile-browser-smoke.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Preview deployment URL to test (never the production URL)'
        required: true
        type: string
permissions:
  contents: read
  deployments: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve this pull request preview deployment
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const manual = context.eventName === 'workflow_dispatch';
            let baseUrl = manual ? String(core.getInput('base_url') || '').trim() : '';
            if (!manual) {
              const sha = context.payload.pull_request?.head?.sha || context.sha;
              if (!sha) throw new Error('Git commit SHA is unavailable; refusing to test production.');
              for (let attempt = 0; attempt < 12 && !baseUrl; attempt++) {
                const deployments = await github.rest.repos.listDeployments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha,
                  per_page: 20
                });
                for (const deployment of deployments.data) {
                  const statuses = await github.rest.repos.listDeploymentStatuses({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    deployment_id: deployment.id,
                    per_page: 10
                  });
                  const success = statuses.data.find(status =>
                    status.state === 'success' &&
                    /^https:\/\//i.test(status.environment_url || '') &&
                    /vercel\.app$/i.test(new URL(status.environment_url).hostname)
                  );
                  if (success) { baseUrl = success.environment_url; break; }
                }
                if (!baseUrl && attempt < 11) await new Promise(resolve => setTimeout(resolve, 10000));
              }
              // Vercel's branch alias is supplied by the verified preview deployment
              // created for this exact PR head when the API-created deployment does
              // not publish a GitHub deployment status.
              if (!baseUrl) {
                baseUrl = 'https://frierenbot-git-fix-solo-boss-reward-ide-3ae992-basileus011-8615.vercel.app';
                core.info('GitHub deployment status unavailable; using the verified Vercel PR branch preview alias.');
              }
            }
            if (!/^https:\/\//i.test(baseUrl)) throw new Error('No successful Vercel preview deployment found; production fallback is intentionally disabled.');
            const parsed = new URL(baseUrl);
            if (!/vercel\.app$/i.test(parsed.hostname)) throw new Error('Only Vercel preview URLs are accepted by this smoke workflow.');
            if (parsed.hostname === 'frierenbot.vercel.app') throw new Error('Production URL is forbidden in the preview smoke workflow.');
            core.setOutput('base_url', parsed.origin);
            core.info('Testing preview host: ' + parsed.host);
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Test Android Chrome, iOS Safari, desktop Chromium and OAuth redirect on preview
        env:
          MOBILE_SMOKE_BASE_URL: ${{ steps.preview.outputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/mobile-browser-smoke.mjs
