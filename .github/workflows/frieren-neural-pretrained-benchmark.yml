name: Frieren Neural — Pretrained CPU Benchmark

on:
  push:
    branches:
      - frieren-neural-foundation
    paths:
      - "frieren-neural/benchmarks/**"
      - ".github/workflows/frieren-neural-pretrained-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen3-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: frieren-neural
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frieren-neural-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frieren-neural/pyproject.toml
      - name: Install CPU PyTorch and project package
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e .
      - name: Install pinned Qwen3-compatible Transformers runtime
        run: python -m pip install "transformers==4.51.3" "safetensors>=0.4.5" "accelerate>=1.6,<2"
      - name: Run fixed 24-prompt CPU benchmark
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python benchmarks/qwen3_cpu.py --output-dir benchmark-results/qwen3-0.6b --threads 2
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: frieren-neural-qwen3-0.6b-cpu-benchmark
          path: frieren-neural/benchmark-results/qwen3-0.6b/
          if-no-files-found: error
          retention-days: 30
