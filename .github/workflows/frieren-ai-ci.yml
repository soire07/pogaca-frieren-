name: Frieren AI CI

on:
  push:
    branches:
      - frieren-ai-agent
  pull_request:
    branches:
      - frieren-ai-agent
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install RPG bot dependencies
        run: npm install
      - name: Install Frieren AI dependencies
        run: npm install --prefix ai-agent
      - name: Run syntax, command audits, and automated tests
        run: npm run check
