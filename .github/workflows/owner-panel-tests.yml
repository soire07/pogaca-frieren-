name: Owner panel tests

on:
  pull_request:
    paths:
      - 'owner-dashboard.js'
      - 'owner-admin.js'
      - 'owner-metrics.js'
      - 'owner-workspaces.js'
      - 'owner-rpg-quests.js'
      - 'owner-rpg-content.js'
      - 'owner-render-control.js'
      - 'rpg-content-catalog.js'
      - 'rpg-mechanics.js'
      - 'gunlukgorev.js'
      - 'zindan.js'
      - 'iblisavasi.js'
      - 'ortakboss.js'
      - 'database/db.js'
      - 'scripts/test-owner-dashboard.js'
      - 'scripts/test-owner-workspaces.js'
      - 'scripts/test-owner-quests.js'
      - 'scripts/test-owner-rpg-content.js'
      - 'scripts/check-gameplay-integrity.js'
      - '.github/workflows/owner-panel-tests.yml'
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'owner-dashboard.js'
      - 'owner-admin.js'
      - 'owner-metrics.js'
      - 'owner-workspaces.js'
      - 'owner-rpg-quests.js'
      - 'owner-rpg-content.js'
      - 'owner-render-control.js'
      - 'rpg-content-catalog.js'
      - 'rpg-mechanics.js'
      - 'gunlukgorev.js'
      - 'zindan.js'
      - 'iblisavasi.js'
      - 'ortakboss.js'
      - 'database/db.js'
      - 'scripts/test-owner-dashboard.js'
      - 'scripts/test-owner-workspaces.js'
      - 'scripts/test-owner-quests.js'
      - 'scripts/test-owner-rpg-content.js'
      - 'scripts/check-gameplay-integrity.js'
      - '.github/workflows/owner-panel-tests.yml'

permissions:
  contents: read

jobs:
  owner-panel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: node --test --test-concurrency=1 scripts/test-owner-dashboard.js scripts/test-owner-workspaces.js scripts/test-owner-quests.js scripts/test-owner-rpg-content.js scripts/test-owner-render-control.js
      - run: node scripts/check-gameplay-integrity.js
