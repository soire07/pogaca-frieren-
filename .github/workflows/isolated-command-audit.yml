name: Frieren isolated command audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frieren_audit
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d frieren_audit" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/frieren_audit
      PGSSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/run-isolated-command-audit.js
      - name: Run real PostgreSQL market concurrency and rollback tests
        run: node --test scripts/test-market-concurrency.integration.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frieren-isolated-command-audit
          path: command-audit-report.json
