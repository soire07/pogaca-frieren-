name: Register Discord Commands

# Command writes are manual-only to prevent every code push from consuming Discord's daily create quota.
permissions:
  contents: read
  statuses: write

concurrency:
  group: discord-command-registration
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frieren_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d frieren_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Paketleri kur
        run: npm install

      - name: Tüm JavaScript dosyalarının sözdizimini kontrol et
        run: find . -path './node_modules' -prune -o -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Tüm proje kontrollerini ve testleri çalıştır
        run: npm run check
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/frieren_test

      - name: Komutları Discord'a kaydet
        run: npm run deploy-commands
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_IDS: '1539562273197260860,1564945192803639356'
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/frieren_test
