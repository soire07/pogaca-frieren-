name: Owner Panel Performance Checks (Manual)

# This workflow previously reran the entire npm test suite on every PR without
# running a distinct performance benchmark. Keep it manual until real benchmarks
# are added; the canonical Frieren Bot CI already covers owner-panel regressions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run the canonical full check once
        run: npm run check
