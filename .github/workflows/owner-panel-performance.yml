name: Owner Panel Performance Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, optimize-owner-panel-complete]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
                - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax and regression checks
        run: npm run check
