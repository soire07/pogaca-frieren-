name: Frieren Neural Qwen3 candidate evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - test/frieren-neural-render-free
    paths:
      - "frieren-neural/scripts/evaluate_qwen3_candidate.py"
      - ".github/workflows/frieren-neural-qwen3-candidate.yml"
  pull_request:
    branches:
      - validation/ufakzeka-real-gguf
    paths:
      - "frieren-neural/scripts/evaluate_qwen3_candidate.py"
      - ".github/workflows/frieren-neural-qwen3-candidate.yml"

permissions:
  contents: read

jobs:
  qwen3-candidate:
    if: github.event.pull_request.head.ref == 'test/frieren-neural-render-free'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frieren-neural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frieren-neural/pyproject.toml
      - name: Install CPU-only PyTorch for the existing fixed benchmark
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
      - name: Install pinned CPU GGUF runtime
        run: python -m pip install --only-binary=llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu "llama-cpp-python==0.3.36"
      - name: Install Frieren Neural package without changing dependencies
        run: python -m pip install --no-deps -e .
      - name: Evaluate pinned Qwen3 model on the same 24 Turkish prompts
        run: python scripts/evaluate_qwen3_candidate.py
      - name: Upload candidate report
        uses: actions/upload-artifact@v4
        with:
          name: frieren-neural-qwen3-candidate-${{ github.sha }}
          path: frieren-neural/quality-reports/qwen3-candidate/
          if-no-files-found: error
          retention-days: 30
