name: Cancel stale Discord command registration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-stale-command-registration.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel the obsolete registration run and verify it stopped
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          for attempt in {1..10}; do
            state="$(gh run view 40852722229 --repo "$GH_REPOSITORY" --json status --jq .status)"
            echo "Stale run state before cancellation attempt $attempt: $state"
            if [[ "$state" != "in_progress" && "$state" != "queued" && "$state" != "requested" ]]; then
              echo "Stale registration run has stopped."
              exit 0
            fi
            gh run cancel 40852722229 --repo "$GH_REPOSITORY" || true
            sleep 5
          done
          state="$(gh run view 40852722229 --repo "$GH_REPOSITORY" --json status,conclusion)"
          echo "Final stale run state: $state"
          [[ "$(printf '%s' "$state" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{try{process.stdout.write(JSON.parse(s).status)}catch{process.stdout.write('unknown')}})")" != "in_progress" ]]
