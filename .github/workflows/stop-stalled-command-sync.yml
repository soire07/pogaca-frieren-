name: Stop stalled Discord command sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stop-stalled-command-sync.yml"

permissions:
  actions: write
  contents: read

jobs:
  stop-stalled-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel stalled attempt so the clean queued attempt can run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          gh run cancel 40873500101 --repo "$GH_REPOSITORY" || true
          for attempt in {1..10}; do
            state="$(gh run view 40873500101 --repo "$GH_REPOSITORY" --json status --jq .status)"
            echo "Stalled registration run state: $state"
            if [[ "$state" != "in_progress" && "$state" != "queued" && "$state" != "requested" ]]; then exit 0; fi
            gh run cancel 40873500101 --repo "$GH_REPOSITORY" || true
            sleep 5
          done
          exit 1
