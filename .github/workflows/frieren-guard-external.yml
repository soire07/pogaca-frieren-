name: Frieren Guard External Security Scan
run-name: "Frieren Guard · Dependency audit #${{ github.run_id }}"

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frieren-guard-external-security
  cancel-in-progress: false

jobs:
  production-dependency-audit:
    name: Audit production dependencies and report to Guardian
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run npm production dependency audit
        run: |
          set +e
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json"
          audit_exit=$?
          set -e
          echo "npm audit exit code: $audit_exit"
          test -s "$RUNNER_TEMP/npm-audit.json"

      - name: Build a bounded Guardian event
        id: audit
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: node guardian/github-guard-sender.js audit "$RUNNER_TEMP/npm-audit.json" "$RUNNER_TEMP/guardian-event.json"

      - name: Send the event using the pinned GitHub Actions OIDC identity
        run: node guardian/github-guard-sender.js send "$RUNNER_TEMP/guardian-event.json"

      - name: Fail the audit after Guardian receives the finding
        if: steps.audit.outputs.has_findings == 'true'
        run: |
          echo "::error title=Production dependency vulnerabilities::Guardian received the signed finding; review it in the Owner Panel."
          exit 1
