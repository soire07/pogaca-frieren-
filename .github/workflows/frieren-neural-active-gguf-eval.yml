name: Frieren Neural Active GGUF Evaluation

on:
  push:
    branches:
      - validation/ufakzeka-real-gguf
    paths:
      - "frieren-neural/trigger-active-gguf-eval.txt"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: frieren-neural-active-gguf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  active-gguf-evaluation:
    if: github.ref == 'refs/heads/validation/ufakzeka-real-gguf'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frieren-neural
    env:
      FRIEREN_MODEL_BACKEND: ufakzeka
      FRIEREN_MODEL_THREADS: "2"
    steps:
      - name: Check out validation commit
        uses: actions/checkout@v4
      - name: Wait for successful Neural CI on this exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p quality-reports/active-gguf
          for attempt in $(seq 1 30); do
            runs="$(curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100")"
            match="$(printf '%s' "$runs" | jq -c --arg sha "$GITHUB_SHA" \
              '.workflow_runs | map(select(.head_sha == $sha and .path == ".github/workflows/frieren-neural-ci.yml")) | sort_by(.run_started_at) | last // empty')"
            if [ -n "$match" ]; then
              status="$(printf '%s' "$match" | jq -r '.status')"
              conclusion="$(printf '%s' "$match" | jq -r '.conclusion // empty')"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "Matching Neural CI ended with $conclusion"
                  exit 1
                fi
                printf '%s' "$match" | jq '{status:"success",failed:0,skipped:0,run_id:.id,workflow_path:.path,head_sha:.head_sha}' > quality-reports/active-gguf/ci-evidence.json
                echo "Verified completed Neural CI run for $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "No successful frieren-neural-ci.yml run for $GITHUB_SHA within five minutes"
          exit 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frieren-neural/pyproject.toml
      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
      - name: Install Neural runtime and test dependencies
        run: python -m pip install -e ".[dev,serve,discord]"
      - name: Run the real pinned GGUF through all 24 prompts
        run: |
          python -m frieren_neural.quality_evaluation \
            --backend ufakzeka \
            --source-commit "$GITHUB_SHA" \
            --output-dir quality-reports/active-gguf
      - name: Verify real-model report contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from frieren_neural.gguf_runtime import MODEL_SHA256

          report = json.loads(Path("quality-reports/active-gguf/quality-report.json").read_text(encoding="utf-8"))
          expected_ids = [f"TR-{index:03d}" for index in range(1, 25)]
          assert report["model_backend"] == "ufakzeka"
          assert report["artifact_sha256"] == MODEL_SHA256
          assert report["checkpoint_sha256"] == MODEL_SHA256
          assert report["source_commit_sha"] == os.environ["GITHUB_SHA"]
          assert [item["id"] for item in report["outputs"]] == expected_ids
          assert all(isinstance(item.get("output"), str) and item["output"].strip() for item in report["outputs"])
          assert report["decision"] == "NOT READY"
          assert "human_review_missing" in report["blocking_reasons"]
          assert "training_provenance_missing" in report["blocking_reasons"]
          assert "held_out_metrics_missing_or_invalid" in report["blocking_reasons"]
          print("REAL_GGUF_24_PROMPTS=PASS")
          print("PINNED_ARTIFACT_SHA256=" + MODEL_SHA256)
          print("QUALITY_DECISION=" + report["decision"])
          print("BLOCKING_REASONS=" + ",".join(report["blocking_reasons"]))
          PY
      - name: Build and validate Guardian-supervised evolution plan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("quality-reports/active-gguf")
          report_path = root / "quality-report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          ci = json.loads((root / "ci-evidence.json").read_text(encoding="utf-8"))
          envelope = {
              "ci": ci,
              "quality_report": report,
              "source_commit_sha": report["source_commit_sha"],
              "artifact_sha256": report["artifact_sha256"],
          }
          (root / "evolution-input.json").write_text(
              json.dumps(envelope, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8"
          )
          PY
          frieren-neural-plan-evolution \
            --report quality-reports/active-gguf/evolution-input.json \
            --output quality-reports/active-gguf/evolution-plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("quality-reports/active-gguf")
          report_path = root / "quality-report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          plan = json.loads((root / "evolution-plan.json").read_text(encoding="utf-8"))
          assert plan["status"] in {"blocked", "improvement_proposed", "eligible_for_guard_review"}
          assert plan["requires_guard_review"] is True
          assert plan["apply_changes"] is False
          assert len(plan["tasks"]) <= 8
          assert plan["source_commit_sha"] == report["source_commit_sha"]
          assert plan["artifact_sha256"] == report["artifact_sha256"]
          if plan["status"] == "eligible_for_guard_review":
              assert report["decision"] == "READY FOR STAGED TEST"
              assert report["human_review"]["completed"] is True
              assert not report["blocking_reasons"]
          report["evolution_plan"] = plan
          report_path.write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8"
          )
          print("EVOLUTION_PLAN_STATUS=" + plan["status"])
          print("EVOLUTION_PLAN_TASKS=" + str(len(plan["tasks"])))
          print("EVOLUTION_PLAN_APPLY_CHANGES=false")
          PY
      - name: Send quality report to Guardian using GitHub OIDC
        if: success()
        env:
          GUARDIAN_URL: https://pogaca-frieren.onrender.com/internal/neural-quality-report
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          audience = "frieren-neural-guardian"
          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in request_url else "?"
          request_url += separator + urllib.parse.urlencode({"audience": audience})
          oidc_request = urllib.request.Request(
              request_url,
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          with urllib.request.urlopen(oidc_request, timeout=15) as response:
              oidc_token = json.loads(response.read())["value"]

          report_path = Path("quality-reports/active-gguf/quality-report.json")
          report_bytes = report_path.read_bytes()
          upload_request = urllib.request.Request(
              os.environ["GUARDIAN_URL"],
              data=report_bytes,
              headers={
                  "Authorization": "Bearer " + oidc_token,
                  "X-GitHub-Token": os.environ["GITHUB_TOKEN"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(upload_request, timeout=25) as response:
                  result = json.loads(response.read())
                  print("GUARDIAN_UPLOAD_STATUS=" + str(response.status))
                  print("GUARDIAN_DECISION=" + str(result.get("decision", "unknown")))
          except urllib.error.HTTPError as error:
              print("GUARDIAN_UPLOAD_HTTP_STATUS=" + str(error.code))
              raise
          PY
      - name: Upload real-model evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frieren-neural-active-gguf-report
          path: frieren-neural/quality-reports/active-gguf/
          if-no-files-found: warn
          retention-days: 14
