name: Frieren AI Health Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frieren-ai-health.yml'
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frieren-ai-health-check
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check Frieren AI liveness
        shell: bash
        env:
          HEALTH_URL: https://pogaca-frieren-kltd.onrender.com/live
        run: |
          response_file="$RUNNER_TEMP/frieren-live.json"
          for attempt in {1..8}; do
            http_code="$(curl --silent --show-error --connect-timeout 10 --max-time 20 -o "$response_file" -w '%{http_code}' "$HEALTH_URL" 2>&1)" || true
            if [[ "$http_code" == "200" ]] && node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{try{const j=JSON.parse(s);process.exit(j.status==='alive'?0:1)}catch{process.exit(1)}})" < "$response_file"; then
              echo "Frieren AI liveness passed (HTTP 200)."
              exit 0
            fi
            echo "::warning::Liveness attempt $attempt/8 failed; HTTP $http_code."
            if [[ "$attempt" -lt 8 ]]; then sleep 5; fi
          done
          echo "::error::Frieren AI liveness failed after 8 attempts."
          exit 1

      - name: Check Frieren AI readiness and Discord connection
        shell: bash
        env:
          READY_URL: https://pogaca-frieren-kltd.onrender.com/health
        run: |
          response_file="$RUNNER_TEMP/frieren-ready.json"
          for attempt in {1..8}; do
            http_code="$(curl --silent --show-error --connect-timeout 10 --max-time 20 -o "$response_file" -w '%{http_code}' "$READY_URL" 2>&1)" || true
            if [[ "$http_code" == "200" ]] && node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{try{const j=JSON.parse(s);process.exit(j.status==='ok' && j.discordReady===true && j.memoryDatabaseReady===true && j.modelConfigured===true ? 0 : 1)}catch{process.exit(1)}})" < "$response_file"; then
              echo "Frieren AI readiness passed (HTTP 200; Discord, memory DB, and model ready)."
              exit 0
            fi
            echo "::warning::Readiness attempt $attempt/8 failed; HTTP $http_code."
            if [[ "$attempt" -lt 8 ]]; then sleep 5; fi
          done
          echo "::error::Frieren AI readiness failed after 8 attempts."
          exit 1
