name: Register Poğaça commands in an additional server

# Manual-only onboarding. The existing main and test guild workflows remain separate.
# This workflow can target exactly one new guild and never changes global commands.
on:
  workflow_dispatch:
    inputs:
      guild_id:
        description: "Yeni Discord sunucusunun ID'si (17–20 rakam)"
        required: true
        type: string
      confirm_guild_id:
        description: "Hedef sunucu ID'sini tekrar gir"
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: discord-command-registration
  cancel-in-progress: false

jobs:
  register-additional-guild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frieren_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d frieren_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Validate the requested target before any Discord access
        env:
          GUILD_ID: ${{ inputs.guild_id }}
          CONFIRM_GUILD_ID: ${{ inputs.confirm_guild_id }}
        run: |
          set -euo pipefail
          if [[ ! "$GUILD_ID" =~ ^[0-9]{17,20}$ ]]; then
            echo "Invalid Discord guild ID; expected a 17–20 digit snowflake."
            exit 1
          fi
          if [[ "$GUILD_ID" != "$CONFIRM_GUILD_ID" ]]; then
            echo "Guild ID confirmation does not match."
            exit 1
          fi
          case "$GUILD_ID" in
            1539562273197260860|1564945192803639356)
              echo "Main and test guilds are protected; use their dedicated workflows."
              exit 1
              ;;
          esac
          echo "Explicit additional-guild target validated."

      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run complete project checks against disposable PostgreSQL
        run: npm run check
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/frieren_test
      - name: Register guild-scoped commands only in the confirmed server
        run: npm run deploy-commands
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_IDS: ${{ inputs.guild_id }}
          SKIP_GLOBAL_COMMAND_SYNC: "true"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/frieren_test
