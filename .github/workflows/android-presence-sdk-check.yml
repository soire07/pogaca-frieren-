name: Android Rich Presence SDK access check

on:
  push:
    branches:
      - feat/android-rich-presence-helper
    paths:
      - .github/workflows/android-presence-sdk-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-sdk-link:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public Drive download access without storing the SDK
        shell: bash
        run: |
          python - <<'PY'
          import re
          import requests

          file_id = "1IdhZ_yHOtsU5OHKk-1IGdQRc-oq7sR2e"
          url = f"https://drive.google.com/uc?export=download&id={file_id}"
          session = requests.Session()
          response = session.get(url, headers={"Range": "bytes=0-4095"}, stream=True, timeout=30)
          content_type = response.headers.get("content-type", "")
          first = next(response.iter_content(4096), b"")
          response.close()

          if response.status_code not in (200, 206):
              raise SystemExit(f"Drive download unavailable: HTTP {response.status_code}")
          if b"<!DOCTYPE html" in first[:512].lower() or b"<html" in first[:512].lower():
              sample = first[:4096].decode("utf-8", "replace")
              if "accounts.google.com" in sample or "Sign in" in sample:
                  raise SystemExit("Drive file is not publicly downloadable; Google sign-in is required.")
              if "virus scan warning" in sample.lower() or "download anyway" in sample.lower():
                  raise SystemExit("Drive requires a confirmation flow; direct download is not yet verified.")
              raise SystemExit("Drive returned an HTML page instead of file bytes.")
          if not first.startswith(b"PK"):
              raise SystemExit(f"Unexpected file format (content-type: {content_type or 'unknown'}).")
          print("DRIVE_ACCESS=OK")
          print(f"HTTP_STATUS={response.status_code}")
          print(f"CONTENT_TYPE={content_type or 'unknown'}")
          print("FILE_SIGNATURE=ZIP/AAR")
          print("SDK_BYTES_NOT_SAVED_OR_PUBLISHED")
          PY
