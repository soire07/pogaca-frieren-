name: Cancel obsolete Discord registration runs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-obsolete-registrations.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Stop all obsolete registration loops and verify cancellation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          runs=(40843337211 40841774538 40841366386 40839501775 40838895344)
          for run_id in "${runs[@]}"; do
            echo "Cancelling obsolete registration run $run_id"
            gh run cancel "$run_id" --repo "$GH_REPOSITORY" || true
          done
          for attempt in {1..12}; do
            active=0
            for run_id in "${runs[@]}"; do
              state="$(gh run view "$run_id" --repo "$GH_REPOSITORY" --json status --jq .status)"
              echo "Run $run_id status: $state"
              if [[ "$state" == "in_progress" || "$state" == "queued" || "$state" == "requested" ]]; then
                active=$((active + 1))
                gh run cancel "$run_id" --repo "$GH_REPOSITORY" || true
              fi
            done
            if [[ "$active" -eq 0 ]]; then
              echo "All obsolete registration runs are stopped."
              exit 0
            fi
            sleep 5
          done
          echo "Some obsolete runs did not stop within the verification window."
          exit 1
