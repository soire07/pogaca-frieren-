name: Owner panel focused tests (Manual)

# Owner-panel tests are already part of npm run check. Keep this focused subset
# available for manual diagnosis instead of rerunning it on every pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-panel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --test --test-concurrency=1 scripts/test-owner-dashboard.js scripts/test-owner-workspaces.js scripts/test-owner-admin.js scripts/test-owner-history.js scripts/test-owner-metrics.js scripts/test-owner-platform.js scripts/test-owner-quests.js scripts/test-owner-rpg-content.js scripts/test-owner-render-control.js ai-agent/owner-scenario-report.test.js
      - run: node scripts/check-gameplay-integrity.js
