name: Render PostgreSQL safety backup

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: render-postgres-safety-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump and verify Render PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check required secret
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add RENDER_DATABASE_URL in repository Actions secrets before running this workflow."
            exit 1
          fi

      - name: Create PostgreSQL custom-format dump
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup
          docker run --rm --network host \
            -e DATABASE_URL \
            -v "$GITHUB_WORKSPACE/backup:/backup" \
            postgres:18-alpine sh -euc '
              pg_dump --format=custom --no-owner --no-acl "$DATABASE_URL" \
                --file="/backup/pogaca-frieren-$(date -u +%Y%m%dT%H%M%SZ).dump"
              pg_restore --list /backup/*.dump >/dev/null
            '
          cd backup
          sha256sum *.dump > SHA256SUMS
          test -s SHA256SUMS
          ls -lh

      - name: Restore backup into an isolated temporary PostgreSQL instance
        run: |
          set -euo pipefail
          container="frieren-restore-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container" \
            --env POSTGRES_PASSWORD="restore-test-${GITHUB_RUN_ID}" \
            --env POSTGRES_DB=restore_test \
            --volume "$GITHUB_WORKSPACE/backup:/backup:ro" \
            postgres:18-alpine >/dev/null

          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U postgres -d restore_test >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$container" pg_isready -U postgres -d restore_test

          docker exec "$container" sh -euc '
            pg_restore --exit-on-error --no-owner --no-acl \
              --dbname="postgresql://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5432/restore_test" \
              /backup/*.dump
          '

          table_count="$(docker exec "$container" psql -U postgres -d restore_test -Atqc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE'")"
          if [ "$table_count" -lt 1 ]; then
            echo "::error::Restore completed but no public tables were found."
            exit 1
          fi
          echo "Isolated restore succeeded; restored public tables: $table_count"
          docker exec "$container" psql -U postgres -d restore_test -c \
            "SELECT current_database() AS restored_database, count(*) AS restored_public_tables FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE'"

      - name: Store verified backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: pogaca-frieren-postgres-${{ github.run_id }}
          path: backup/
          if-no-files-found: error
          retention-days: 90
