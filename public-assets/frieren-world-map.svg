<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">Frieren dünyası — Kuzey ve Merkez Topraklar</title>
<desc id="map-desc">Frieren animesindeki Kuzey Toprakları, Merkez Topraklar, Größe Ormanı, Kühl Bölgesi, Schwer Dağları ve Ende coğrafyasından esinlenen fan yapımı parşömen atlası.</desc>
<defs>
