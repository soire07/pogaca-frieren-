name: Audit character image URLs

on:
  workflow_dispatch:
  push:
    paths:
      - "character-data.js"
      - "scripts/check-character-images.js"
      - ".github/workflows/audit-character-images.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Check all character image URLs
        id: audit
        run: |
          set +e
          node scripts/check-character-images.js > image-audit-report.json
          audit_status=$?
          cat image-audit-report.json
          exit "$audit_status"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: character-image-audit-report
          path: image-audit-report.json
          if-no-files-found: warn
          retention-days: 14
